[project]
name = "complyadi-giftcity-chatbot"
version = "2.0.0"
description = "ComplyADI - GIFT City IFSC Compliance FAQ Chatbot (FastAPI, LangGraph, Vectorless Qdrant, PostgreSQL, Redis)"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic-settings>=2.4.0",
    "email-validator>=2.2.0",
    "loguru>=0.7.2",
    "sqlalchemy>=2.0.0",
    "asyncpg>=0.30.0",
    "greenlet>=3.0.0",
    "redis>=5.0.0",
    "qdrant-client>=1.12.0",
    "langgraph>=0.2.0",
    "langchain-core>=0.3.0",
    "langchain-groq>=0.2.0",
    "langchain-openai>=0.2.0",
    "openai>=1.40.0",
    "bcrypt>=4.0.0",
    "pyjwt>=2.8.0",
    "pypdf>=5.0.0",
    "python-multipart>=0.0.12",
    "httpx>=0.27.0",
]
